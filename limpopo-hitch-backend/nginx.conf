server {
    listen 80;
    server_name hitchconnect.co.za www.hitchconnect.co.za;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name hitchconnect.co.za www.hitchconnect.co.za;

    # SSL Certificates (Managed via Certbot Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/hitchconnect.co.za/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/hitchconnect.co.za/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Frontend Static Site Root
    root /var/www/limpopo-hitch/dist;
    index index.html;

    # React SPA Client-Side Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache Static Assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # REST API Proxy to Node.js Backend
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.io Live Telemetry WebSocket Proxy
    location /socket.io/ {
        proxy_pass http://127.0.0.1:8080/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400; # 24h WebSocket persistence
    }
}
